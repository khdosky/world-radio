<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>World Radio</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brand-icon">◉</span><div><strong>World Radio</strong><small>Listen to the world</small></div></div><button id="back" class="icon-btn hidden" aria-label="Go back">←</button></header>
<main><div class="intro"><span class="eyebrow">GLOBAL RADIO</span><h1 id="pageTitle">Discover live radio</h1><p id="pageSubtitle">Explore stations around the world.</p></div><div class="searchbox"><span>⌕</span><input id="search" placeholder="Search countries" autocomplete="off" aria-label="Search"></div><div id="status" role="status"></div><div id="content"></div><div id="moreWrap" class="hidden"><button id="more">Load more stations</button></div></main>
<div id="miniPlayer" class="player hidden"><div class="player-main"><span class="player-logo">♫</span><div class="player-text"><strong id="nowTitle">No station selected</strong><small id="nowCountry"> </small></div><button id="favoriteCurrent" class="icon-btn" aria-label="Add to favourites">♡</button><button id="playPause" class="icon-btn" aria-label="Play or pause">▶</button></div><div id="playStatus" aria-live="polite"></div></div>
<nav aria-label="Main navigation"><button data-view="home" class="active"><span>⌂</span>Home</button><button data-view="countries"><span>◎</span>Countries</button><button data-view="favorites"><span>♡</span>Favourites</button><button data-view="recent"><span>◷</span>Recent</button></nav><audio id="audio" preload="none"></audio><script src="app.js"></script></body></html>
